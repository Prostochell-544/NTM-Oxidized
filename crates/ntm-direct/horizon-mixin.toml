[mod]
id = "ntm_direct"
version = "0.1.0"

[compatibility]
horizon_revision = "31f83499b6c2cff7a8e7bf45f8173a7a95c2767c"

# Copied into the bundle by assemble.py: a bundle can't reach outside its folder.
[[crate]]
id = "ntm_core"
path = "ntm_core"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "ntm_direct"
source = "runtime.rs"

[[injection]]
id = "server_tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = []

[[injection]]
id = "level_tick_pre"
hook = "level_tick_pre"
hook_version = 1
kind = "HEAD"
helper = "level_tick_pre.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }, { name = "dimension", ty = "&str", value = "dimension" }]

[[injection]]
id = "world_lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "world_lifecycle.rs"
bindings = [{ name = "phase", ty = "WorldPhase", value = "phase" }]

[[injection]]
id = "chunk_load"
hook = "chunk_load"
hook_version = 1
kind = "HEAD"
helper = "chunk_load.rs"
bindings = [{ name = "dimension", ty = "&str", value = "dimension" }, { name = "chunk", ty = "[i32; 2]", value = "chunk" }]

[[injection]]
id = "chunk_unload"
hook = "chunk_unload"
hook_version = 1
kind = "HEAD"
helper = "chunk_unload.rs"
bindings = [{ name = "dimension", ty = "&str", value = "dimension" }, { name = "chunk", ty = "[i32; 2]", value = "chunk" }]

[[injection]]
id = "block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [{ name = "block", ty = "&str", value = "block" }, { name = "entity", ty = "&mut Option<(String, Compound)>", value = "entity" }]

[[injection]]
id = "block_entity_ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [{ name = "block", ty = "&str", value = "block" }, { name = "ticks", ty = "&mut bool", value = "ticks" }]

[[injection]]
id = "block_entity_container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [{ name = "block", ty = "&str", value = "block" }, { name = "container", ty = "&mut Option<ModContainer>", value = "container" }]

[[injection]]
id = "block_entity_tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }, { name = "pos", ty = "[i32; 3]", value = "pos" }, { name = "entity", ty = "&mut ModBlockEntity", value = "entity" }]

[[injection]]
id = "use_item_on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }, { name = "stack", ty = "&ItemStack", value = "stack" }, { name = "pos", ty = "[i32; 3]", value = "pos" }, { name = "claimed", ty = "&mut bool", value = "claimed" }]
